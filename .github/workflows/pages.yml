name: Deploy Price Manager to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: read the tree, publish a Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deployments race; a catalog publish pushes to main too.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        # enablement:true turns Pages on the first time this runs,
        # so the site needs no manual setup in repository settings.
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
